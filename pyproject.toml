[project]
name = "fraudshield"
version = "0.1.0"
description = "Booking-time fraud scoring for parcel-carrier accounts (hackathon prototype)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "anthropic>=0.40",
    "pywebview>=6.2.1",
    "cryptography>=50",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5",
    "laya[serve]>=0.3.23",
    "transformers>=4.48",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs CUDA and the Laya model (skipped by default unless FS_GPU_TESTS=1)",
    "slow: slow data tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fraudshield"]
